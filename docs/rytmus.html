<!DOCTYPE html>
<html lang="cs">
    <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rytmus</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script defer src="script.js?v=2"></script>
  </head>
  <body class="page-rhythm" data-page="rytmus">
    <header class="top-bar">
      <div class="top-bar-actions">
        <a class="icon-btn" href="index.html" aria-label="Domů">
          <img src="home-icon.svg" alt="Domů" />
        </a>
      </div>
      <button class="pill-btn" id="next-sentence" type="button">Další věta</button>
    </header>

    <main class="content-shell">
      <section class="panel panel-rytmus rhythm-panel">
        <div class="panel-title">RYTMUS</div>
        <div class="rhythm-text-block">
          <div class="sentence-row">
            <p id="sentence" class="sentence rhythm-sentence"></p>
            <button id="play-audio-btn" class="play-audio-btn" type="button" aria-label="Přehrát audio">▶</button>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
